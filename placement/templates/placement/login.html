```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #F8FAFC;
            color: #334155;
            margin: 0;
        }

        header {
            background: #142B4A;
            color: white;
            padding: 20px;
            text-align: center;
        }

        main {
            max-width: 450px;
            margin: 40px auto;
            padding: 25px;
            background: white;
            border: 1px solid #E2E8F0;
            border-radius: 12px;
        }

        h2 {
            color: #142B4A;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border: 1px solid #CBD5E1;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 22px;
            background: #0D9488;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .errorlist {
            color: #B91C1C;
        }

        a {
            color: #0D766E;
        }
    </style>
</head>

<body>
    <header>
        <h1>Student Placement Tracker</h1>
        <p>Welcome back!</p>
    </header>

    <main>
        <h2>Student Login</h2>

        {% if form.errors %}
            <p class="errorlist">
                Username or password is incorrect.
                Please try again.
            </p>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">Login</button>
        </form>

        <p>New student? <a href="/register/">Create an account</a></p>
        <p><a href="/">Back to Home</a></p>
    </main>
</body>
</html>
